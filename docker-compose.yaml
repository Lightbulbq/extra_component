version: "3.8"

services:
  visualization:
    build:
      context: .
      dockerfile: Dockerfile.visualization
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./models:/app/models
      - ./data:/app/data
    environment:
      # Optional: Set Streamlit configuration
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
